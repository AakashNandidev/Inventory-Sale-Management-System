{% extends "base.html" %}

{% block title %}Add Supplier - StockManager{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="mb-4">
        <h2 class="fw-bold">Add Supplier</h2>
        <p class="text-muted">Add a new supplier to your business</p>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body">

            <form method="POST">
                {% csrf_token %}

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Supplier Name</label>
                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            placeholder="Enter supplier name"
                            required
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Company</label>
                        <input
                            type="text"
                            name="company"
                            class="form-control"
                            placeholder="Enter company name"
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Email</label>
                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="Enter email"
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Phone</label>
                        <input
                            type="text"
                            name="phone"
                            class="form-control"
                            placeholder="Enter phone number"
                        >
                    </div>

                    <div class="col-12 mb-3">
                        <label class="form-label">Address</label>
                        <textarea
                            name="address"
                            class="form-control"
                            rows="3"
                            placeholder="Enter supplier address"
                        ></textarea>
                    </div>

                </div>

                <button type="submit" class="btn btn-primary">
                    Save Supplier
                </button>

                <a href="{% url 'suppliers' %}" class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>
    </div>

</div>

{% endblock %}
