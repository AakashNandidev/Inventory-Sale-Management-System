{% extends "base.html" %}

{% block title %}Edit Product - StockManager{% endblock %}
{% block page_title %}Edit Product{% endblock %}

{% block content %}

<div class="mb-4">
    <h2 class="fw-bold">Edit Product</h2>
    <p class="text-muted">Update your product details.</p>
</div>

<div class="card border-0 shadow-sm">
    <div class="card-body">

        <form method="POST">
            {% csrf_token %}

            <div class="row g-3">

                <div class="col-md-6">
                    <label class="form-label">Product Name</label>
                    <input name="name" class="form-control" value="{{ product.name }}" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">SKU</label>
                    <input name="sku" class="form-control" value="{{ product.sku }}">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Category</label>
                    <input name="category" class="form-control" value="{{ product.category }}">
                </div>

                <div class="col-md-6 mb-3">
    <label class="form-label">Supplier</label>

    <select name="supplier" class="form-control">
        <option value="">Select Supplier</option>

        {% for supplier in suppliers %}
            <option value="{{ supplier.id }}"
                {% if product.supplier and product.supplier.id == supplier.id %}
                    selected
                {% endif %}
            >
                {{ supplier.name }}
            </option>
        {% endfor %}
    </select>
</div>

                <div class="col-md-4">
                    <label class="form-label">Quantity</label>
                    <input type="number" name="quantity" class="form-control" value="{{ product.quantity }}" min="0">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Purchase Price</label>
                    <input type="number" name="purchase_price" class="form-control" value="{{ product.purchase_price }}"
                        step="0.01" min="0">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Selling Price</label>
                    <input type="number" name="selling_price" class="form-control" value="{{ product.selling_price }}"
                        step="0.01" min="0">
                </div>

                <div class="col-12">
                    <button type="submit" class="btn btn-primary">
                        Update Product
                    </button>

                    <a href="{% url 'inventory' %}" class="btn btn-light ms-2">
                        Cancel
                    </a>
                </div>

            </div>
        </form>

    </div>
</div>

{% endblock %}
