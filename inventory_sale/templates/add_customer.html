{% extends "base.html" %}

{% block title %}Add Customer - StockManager{% endblock %}
{% block page_title %}Add Customer{% endblock %}
{% block nav_customers %}active{% endblock %}

{% block content %}

<div class="mb-4">
    <h2 class="fw-bold">Add Customer</h2>
    <p class="text-muted">Add a new customer to your account.</p>
</div>

<div class="card border-0 shadow-sm">
    <div class="card-body">

        <form method="POST">
            {% csrf_token %}

            <div class="row g-3">

                <div class="col-md-6">
                    <label class="form-label">Customer Name</label>
                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        required
                    >
                </div>

                <div class="col-md-6">
                    <label class="form-label">Email</label>
                    <input
                        type="email"
                        name="email"
                        class="form-control"
                    >
                </div>

                <div class="col-md-6">
                    <label class="form-label">Phone</label>
                    <input
                        type="text"
                        name="phone"
                        class="form-control"
                    >
                </div>

                <div class="col-12">
                    <label class="form-label">Address</label>
                    <textarea
                        name="address"
                        class="form-control"
                        rows="3"
                    ></textarea>
                </div>

                <div class="col-12">
                    <button type="submit" class="btn btn-primary">
                        Add Customer
                    </button>

                    <a href="{% url 'customers' %}" class="btn btn-light ms-2">
                        Cancel
                    </a>
                </div>

            </div>

        </form>

    </div>
</div>

{% endblock %}
