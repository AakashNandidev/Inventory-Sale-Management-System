{% extends "base.html" %}
{% block title %}New Sale - StockManager{% endblock %}
{% block page_title %}New Sale{% endblock %}
{% block nav_new_sale %}active{% endblock %}
{% block content %}

<div class="mb-4">
    <h2 class="fw-bold">New Sale</h2>
    <p class="text-muted">Create a new sale and invoice.</p>
</div>
<div class="card border-0 shadow-sm">
    <div class="card-body">
        <form method="POST">{% csrf_token %}<div class="row g-3">
                <div class="col-md-6"><label class="form-label">Customer</label><select name="customer"
                        class="form-select" required>
                        <option value="">Select customer</option>

                        {% for customer in customers %}
                        <option value="{{ customer.id }}">
                            {{ customer.name }}
                        </option>
                        {% empty %}
                        <option value="">No customers available</option>
                        {% endfor %}
                    </select></div>
                <div class="col-md-6"><label class="form-label">Product</label><select name="product"
                        class="form-select" required>
                        <option value="">Select product</option>

                        {% for product in products %}
                        <option value="{{ product.id }}">
                            {{ product.name }} - Stock: {{ product.quantity }}
                        </option>
                        {% endfor %}
                    </select></div>
                <div class="col-md-4">
                    <label class="form-label">Quantity</label><input type="number" name="quantity"
                        class="form-control" min="1"></div>
                <div class="col-md-4">
                    <label class="form-label">Payment Status</label>
                    <select name="payment_status" class="form-select" required>
                        <option value="">Select payment status</option>
                        <option value="Paid">Paid</option>
                        <option value="Pending">Pending</option>
                        <option value="Partial">Partial</option>
                    </select></div>
                <div class="col-12"><button class="btn btn-primary">Create Sale</button><a href="/sales/"
                        class="btn btn-light ms-2">Cancel</a></div>
            </div>
        </form>
    </div>
</div>

{% endblock %}
