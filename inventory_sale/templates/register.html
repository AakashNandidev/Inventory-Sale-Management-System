<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - StockManager</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .register-container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
        }

        .brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand h2 {
            font-weight: 700;
            color: #212529;
        }

        .brand p {
            color: #6c757d;
        }

        .register-card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .form-label {
            font-weight: 500;
        }

        .form-control {
            padding: 12px;
            border-radius: 8px;
        }

        .register-btn {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
        }

        .bottom-text {
            text-align: center;
            margin-top: 20px;
            color: #6c757d;
        }

        .bottom-text a {
            text-decoration: none;
            font-weight: 600;
        }

        .home-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
            color: #6c757d;
        }
    </style>
</head>

<body>

<div class="register-container">

    <div class="brand">
        <h2>StockManager</h2>
        <p>Start managing your business today.</p>
    </div>

    <div class="register-card">

        <h4 class="text-center mb-4">Create Your Account</h4>

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Choose a username"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your email"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Create a password"
                    required>
            </div>

            <div class="mb-4">
                <label class="form-label">Confirm Password</label>
                <input
                    type="password"
                    name="confirm_password"
                    class="form-control"
                    placeholder="Confirm your password"
                    required>
            </div>

            <button type="submit" class="btn btn-primary register-btn">
                Create Account
            </button>

        </form>

        <div class="bottom-text">
            Already have an account?
            <a href="{% url 'login' %}">Login</a>
        </div>

    </div>

    <a href="{% url 'home' %}" class="home-link">
        ← Back to Home
    </a>

</div>

</body>
</html>
