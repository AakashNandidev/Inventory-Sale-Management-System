{% extends "base.html" %}

{% block title %}Delete Supplier - StockManager{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="card border-0 shadow-sm">
        <div class="card-body">

            <h3 class="fw-bold">Delete Supplier</h3>

            <p>
                Are you sure you want to delete
                <strong>{{ supplier.name }}</strong>?
            </p>

            <form method="POST">
                {% csrf_token %}

                <button type="submit" class="btn btn-danger">
                    Yes, Delete
                </button>

                <a href="{% url 'suppliers' %}" class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>
    </div>

</div>

{% endblock %}
