{% extends "base.html" %}

{% block title %}Edit Supplier - StockManager{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="mb-4">
        <h2 class="fw-bold">Edit Supplier</h2>
        <p class="text-muted">Update supplier information</p>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body">

            <form method="POST">
                {% csrf_token %}

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Supplier Name</label>
                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            value="{{ supplier.name }}"
                            required
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Company</label>
                        <input
                            type="text"
                            name="company"
                            class="form-control"
                            value="{{ supplier.company }}"
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Email</label>
                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            value="{{ supplier.email }}"
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Phone</label>
                        <input
                            type="text"
                            name="phone"
                            class="form-control"
                            value="{{ supplier.phone }}"
                        >
                    </div>

                    <div class="col-12 mb-3">
                        <label class="form-label">Address</label>
                        <textarea
                            name="address"
                            class="form-control"
                            rows="3"
                        >{{ supplier.address }}</textarea>
                    </div>

                </div>

                <button type="submit" class="btn btn-primary">
                    Update Supplier
                </button>

                <a href="{% url 'suppliers' %}" class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>
    </div>

</div>

{% endblock %}
