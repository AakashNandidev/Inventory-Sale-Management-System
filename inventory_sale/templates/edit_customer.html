{% extends "base.html" %}

{% block title %}Edit Customer - StockManager{% endblock %}

{% block content %}

<div class="container mt-4">

    <h2>Edit Customer</h2>

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Customer Name</label>
            <input
                type="text"
                name="name"
                class="form-control"
                value="{{ customer.name }}"
                required
            >
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input
                type="email"
                name="email"
                class="form-control"
                value="{{ customer.email }}"
            >
        </div>

        <div class="mb-3">
            <label class="form-label">Phone</label>
            <input
                type="text"
                name="phone"
                class="form-control"
                value="{{ customer.phone }}"
            >
        </div>

        <div class="mb-3">
            <label class="form-label">Address</label>
            <textarea
                name="address"
                class="form-control"
                rows="3"
            >{{ customer.address }}</textarea>
        </div>

        <button type="submit" class="btn btn-primary">
            Update Customer
        </button>

        <a href="{% url 'customers' %}" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
